services:
  gabe-whats-api:
    build: .
    container_name: gabe-whats-api
    command: ["gabe-whats-api"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GABE_WHATS_HTTP_ADDR: 0.0.0.0:8080
      GABE_WHATS_API_KEY: ${GABE_WHATS_API_KEY:?Defina GABE_WHATS_API_KEY nas variáveis de ambiente}
      GABE_WHATS_SQLITE_DSN: file:/app/data/session.db?_foreign_keys=on
      GABE_WHATS_APP_DSN: file:/app/data/app.db
      GABE_WHATS_MEDIA_DIR: /app/data/media
      GABE_WHATS_MEDIA_URL_TTL: ${GABE_WHATS_MEDIA_URL_TTL:-15m}
      GABE_WHATS_LOG_LEVEL: ${GABE_WHATS_LOG_LEVEL:-info}
      GABE_WHATS_OPENAPI_PATH: /app/docs/openapi.yaml
      GABE_WHATS_WEBHOOK_URL: ${GABE_WHATS_WEBHOOK_URL:-}
      GABE_WHATS_WEBHOOK_SECRET: ${GABE_WHATS_WEBHOOK_SECRET:-}
      GABE_WHATS_WEBHOOK_IGNORE_FROM_ME: ${GABE_WHATS_WEBHOOK_IGNORE_FROM_ME:-true}
      GABE_WHATS_WEBHOOK_ALLOW_JIDS: ${GABE_WHATS_WEBHOOK_ALLOW_JIDS:-}
      GABE_WHATS_AUTO_DOWNLOAD_MEDIA: ${GABE_WHATS_AUTO_DOWNLOAD_MEDIA:-true}
      GABE_WHATS_WEBHOOK_INCLUDE_BASE64: ${GABE_WHATS_WEBHOOK_INCLUDE_BASE64:-false}
      GABE_WHATS_HUMANIZE: ${GABE_WHATS_HUMANIZE:-true}
      GABE_WHATS_TYPING_CPS: ${GABE_WHATS_TYPING_CPS:-6}
      GABE_WHATS_SEND_GAP_MIN: ${GABE_WHATS_SEND_GAP_MIN:-1200ms}
      GABE_WHATS_SEND_GAP_MAX: ${GABE_WHATS_SEND_GAP_MAX:-3500ms}
      GABE_WHATS_TYPING_MAX: ${GABE_WHATS_TYPING_MAX:-8s}
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  gabe-whats-mcp:
    build: .
    container_name: gabe-whats-mcp
    command: ["gabe-whats-mcp", "--transport", "http", "--http-addr", "0.0.0.0:8090"]
    restart: unless-stopped
    depends_on:
      gabe-whats-api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      GABE_WHATS_API_URL: http://gabe-whats-api:8080
      GABE_WHATS_API_KEY: ${GABE_WHATS_API_KEY:?Defina GABE_WHATS_API_KEY nas variáveis de ambiente}
      GABE_WHATS_MCP_TOKEN: ${GABE_WHATS_MCP_TOKEN:-}
    expose:
      - "8090"
    # Deploy no Dokploy (Domains -> Add Domain):
    #   - Para o conector MCP (agentes.chat / clientes remotos):
    #     Service Name: gabe-whats-mcp | Container Port: 8090 | HTTPS: On
    #     Endpoint resultante: https://<seu-subdominio>/mcp
    #     Header obrigatório: Authorization: Bearer <GABE_WHATS_MCP_TOKEN>
    #
    #   - (Opcional) Para expor também a API REST (/docs, /api/v1/*):
    #     Service Name: gabe-whats-api | Container Port: 8080 | HTTPS: On
    #
    # Atrás de Caddy standalone no nexus:
    #   whats.<seu-dominio> {
    #     reverse_proxy gabe-whats-mcp:8090
    #   }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
